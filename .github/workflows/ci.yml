name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @opencode-dashboard/shared build

      - name: Typecheck (BFF)
        run: pnpm --filter @opencode-dashboard/bff typecheck

      - name: Typecheck (Web)
        run: pnpm --filter @opencode-dashboard/web typecheck

      - name: Run unit tests (BFF)
        run: pnpm --filter @opencode-dashboard/bff test

      - name: Run unit tests (Web)
        run: pnpm --filter @opencode-dashboard/web test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @opencode-dashboard/shared build

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Run current and baseline benchmarks
        env:
          NO_COLOR: 1
        run: |
          set -euo pipefail
          current_sha=$(git rev-parse HEAD)
          previous_sha=$(git rev-parse HEAD^)
          main_sha=$(git rev-parse origin/main)
          results="$GITHUB_WORKSPACE/benchmark-results"
          mkdir -p "$results"

          run_benchmarks() {
            root="$1"
            label="$2"
            pnpm --dir "$root" install --frozen-lockfile
            pnpm --dir "$root" exec tsc -p packages/shared/tsconfig.json
            pnpm --dir "$root" --filter @opencode-dashboard/bff exec vitest bench --run \
              --outputJson "$results/$label-bff.json"
            pnpm --dir "$root" --filter @opencode-dashboard/web exec vitest bench --run \
              --outputJson "$results/$label-web.json"
          }

          git worktree add --detach "$RUNNER_TEMP/benchmark-previous" "$previous_sha"
          git worktree add --detach "$RUNNER_TEMP/benchmark-main" "$main_sha"
          run_benchmarks "$GITHUB_WORKSPACE" current
          run_benchmarks "$RUNNER_TEMP/benchmark-previous" previous
          run_benchmarks "$RUNNER_TEMP/benchmark-main" main
          node scripts/parse-benchmark.mjs \
            "$results" "$current_sha" "$previous_sha" "$main_sha" \
            > "$results/report.md"

      - name: Write benchmark summary
        run: cat benchmark-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark
          recreate: true
          path: benchmark-results/report.md
