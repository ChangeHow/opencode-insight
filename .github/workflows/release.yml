name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - id: changesets
        uses: changesets/action@v1
        with:
          commit-message: "chore(release): version packages"
          publish-script: "pnpm changeset publish"
          pr-title: "chore(release): version packages"
      - if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: gh pr merge "$RELEASE_PR" --auto --squash
      - if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          for attempt in {1..120}; do
            state=$(gh pr view "$RELEASE_PR" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              git fetch origin main
              git checkout --detach origin/main
              pnpm install --frozen-lockfile
              pnpm changeset publish
              exit 0
            fi
            if [ "$state" != "OPEN" ]; then
              echo "Release PR #$RELEASE_PR closed without merging."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for release PR #$RELEASE_PR to merge."
          exit 1
