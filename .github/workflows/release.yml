name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      beta_version:
        description: Explicit beta version, for example 1.1.0-beta.0
        type: string
        required: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'push' || (github.ref == 'refs/heads/main' && inputs.channel == 'stable')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore(release): version packages"
          publish: "true"
          title: "chore(release): version packages"
      - if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: gh pr merge "$RELEASE_PR" --auto --squash
      - if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          for attempt in {1..120}; do
            state=$(gh pr view "$RELEASE_PR" --json state --jq .state)
            if [ "$state" = "MERGED" ]; then
              git fetch origin main
              git checkout --detach origin/main
              pnpm install --frozen-lockfile
              pnpm changeset publish
              exit 0
            fi
            if [ "$state" != "OPEN" ]; then
              echo "Release PR #$RELEASE_PR closed without merging."
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for release PR #$RELEASE_PR to merge."
          exit 1

  beta:
    if: github.event_name == 'workflow_dispatch' && inputs.channel == 'beta'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-beta-release
      cancel-in-progress: false
    env:
      BETA_VERSION: ${{ inputs.beta_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Validate beta version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.BETA_VERSION ?? '';
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(version)) throw new Error('Expected an explicit x.y.z-beta.n version');
          const current = JSON.parse(fs.readFileSync('package.json', 'utf8')).version.split('.').map(Number);
          const next = version.split('-')[0].split('.').map(Number);
          const difference = next.map((part, index) => part - current[index]).find(value => value !== 0) ?? 0;
          if (difference <= 0) throw new Error('Beta base version must be greater than the current stable version');
          NODE
          if npm view "@changehow/oc-insight@$BETA_VERSION" version --json >/dev/null 2>&1; then
            echo "Version already exists: $BETA_VERSION"
            exit 1
          fi
          npm version "$BETA_VERSION" --no-git-tag-version --ignore-scripts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - name: Publish beta through npm Trusted Publishing
        run: npm publish --ignore-scripts --access public --tag beta
