<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session insight</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.45 system-ui,
          sans-serif;
        color: var(--oc-fg, CanvasText);
        background: var(--oc-bg, Canvas);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        padding: 16px;
        max-width: 1100px;
        margin: auto;
        overflow-wrap: anywhere;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0;
      }
      h2 {
        font-size: 1rem;
        margin: 18px 0 10px;
      }
      p {
        margin: 10px 0;
      }
      small {
        font-size: 0.8rem;
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        border: 1px solid var(--oc-border, GrayText);
        background: var(--oc-elevated, Canvas);
        border-radius: var(--oc-radius, 6px);
        padding: 5px 10px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--oc-hover, ButtonFace);
      }
      :focus-visible {
        outline: 2px solid var(--oc-focus, Highlight);
        outline-offset: 2px;
      }
      .muted,
      code {
        color: var(--oc-muted, GrayText);
      }
      code {
        font-family: var(--oc-mono, monospace);
        font-size: 0.8rem;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 8px;
        margin: 16px 0;
      }
      .metric {
        background: var(--oc-muted-surface, ButtonFace);
        border-radius: var(--oc-radius, 6px);
        padding: 10px;
        min-width: 0;
      }
      .metric > * {
        display: block;
      }
      .metric > span {
        font-size: 0.8rem;
      }
      .metric strong {
        font-size: 1.2rem;
        font-variant-numeric: tabular-nums;
        margin: 3px 0;
      }
      .notice {
        background: var(--oc-muted-surface, ButtonFace);
        padding: 10px;
        border-radius: var(--oc-radius, 6px);
        color: var(--oc-warning-text, CanvasText);
        margin: 12px 0;
      }
      .error {
        color: var(--oc-error-text, CanvasText);
      }
      .empty {
        color: var(--oc-muted, GrayText);
        padding: 28px 0;
      }
      [role="tablist"] {
        display: flex;
        gap: 6px;
        margin: 16px 0;
      }
      [aria-selected="true"] {
        color: var(--oc-primary-text, Highlight);
        background: var(--oc-selection, ButtonFace);
        border-color: var(--oc-primary, Highlight);
      }
      .legend {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 0.8rem;
      }
      .output {
        color: var(--oc-primary, Highlight);
        stroke: var(--oc-primary, Highlight);
      }
      .reasoning {
        color: var(--oc-info-text, GrayText);
        stroke: var(--oc-info-text, GrayText);
      }
      .summary {
        color: var(--oc-warning-text, GrayText);
        stroke: var(--oc-warning-text, GrayText);
        stroke-dasharray: 2 3;
      }
      .chart {
        position: relative;
        min-width: 0;
        margin-top: 10px;
        touch-action: pan-y;
      }
      svg {
        display: block;
        width: 100%;
        height: 280px;
        overflow: visible;
      }
      svg text {
        font-size: 11px;
        fill: var(--oc-muted, GrayText);
      }
      .grid {
        stroke: var(--oc-border, GrayText);
        opacity: 0.5;
      }
      .line {
        fill: none;
        stroke-width: 2;
        vector-effect: non-scaling-stroke;
        stroke-linecap: round;
      }
      .mean {
        stroke: var(--oc-fg, CanvasText);
        stroke-dasharray: 7 5;
        opacity: 0.7;
      }
      .cursor {
        stroke: var(--oc-muted, GrayText);
        stroke-dasharray: 3 3;
      }
      .tooltip {
        position: absolute;
        top: 14px;
        padding: 9px;
        background: var(--oc-elevated, Canvas);
        color: var(--oc-elevated-fg, CanvasText);
        border: 1px solid var(--oc-border, GrayText);
        border-radius: var(--oc-radius, 6px);
        box-shadow: 0 2px 8px #0002;
        max-width: min(280px, 100%);
        max-height: calc(100% - 20px);
        overflow: auto;
        font-size: 0.8rem;
        z-index: 1;
      }
      [hidden] {
        display: none !important;
      }
      .scrubber {
        display: flex;
        gap: 10px;
        align-items: center;
        font-size: 0.85rem;
      }
      .scrubber input {
        min-width: 0;
        flex: 1;
        accent-color: var(--oc-primary, Highlight);
      }
      .source {
        padding: 9px 0;
        border-bottom: 1px solid var(--oc-border, GrayText);
      }
      .source summary {
        cursor: pointer;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px;
      }
      .bar-track {
        grid-column: 1 / -1;
        height: 8px;
        background: var(--oc-muted-surface, ButtonFace);
        border-radius: 4px;
        overflow: hidden;
      }
      .bar {
        display: block;
        height: 100%;
        background: var(--oc-primary, Highlight);
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      .source li {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
        flex-wrap: wrap;
      }
      .timeline li {
        margin: 14px 0;
      }
      .lane-track {
        height: 8px;
        background: var(--oc-muted-surface, ButtonFace);
        margin-top: 4px;
        overflow: hidden;
        border-radius: 4px;
      }
      .lane {
        display: block;
        height: 100%;
        background: var(--oc-primary, Highlight);
      }
      .lane.background {
        background: var(--oc-info, GrayText);
      }
      @media (max-width: 420px) {
        main {
          padding: 12px;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .metric strong {
          font-size: 1.05rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="./main.js" defer></script>
  </body>
</html>
