name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @opencode-dashboard/shared build

      - name: Typecheck (BFF)
        run: pnpm --filter @opencode-dashboard/bff typecheck

      - name: Typecheck (Web)
        run: pnpm --filter @opencode-dashboard/web typecheck

      - name: Run unit tests (BFF)
        run: pnpm --filter @opencode-dashboard/bff test

      - name: Run unit tests (Web)
        run: pnpm --filter @opencode-dashboard/web test

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @opencode-dashboard/shared build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build shared package
        run: pnpm --filter @opencode-dashboard/shared build

      - name: Run benchmarks
        env:
          NO_COLOR: 1
        run: |
          pnpm bench 2>&1 |
            sed '/^Benchmarking is/d' |
            sed '/^Breaking changes/d' |
            sed '/^ RUN /d' |
            sed '/^ExperimentalWarning:/d' |
            sed '/^Use `node --trace-warnings`/d' |
            sed '/^\s*$/d' |
            tee benchmark-results.txt

      - name: Write benchmark summary
        run: |
          {
            echo "## Benchmark Results"
            echo ""
            echo '```text'
            cat benchmark-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: benchmark
          recreate: true
          path: benchmark-results.txt
