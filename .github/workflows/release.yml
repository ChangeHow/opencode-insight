name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - id: release-plan
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/release-plan.json"
          node -e 'const plan = require(process.argv[1]); console.log(`has_releases=${plan.releases.length > 0}`)' "$RUNNER_TEMP/release-plan.json" >> "$GITHUB_OUTPUT"
      - if: steps.release-plan.outputs.has_releases == 'true'
        run: |
          pnpm changeset version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .changeset package.json pnpm-lock.yaml
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          git commit -m "chore(release): version packages"
          git push
      - if: steps.release-plan.outputs.has_releases == 'true'
        run: pnpm changeset publish
